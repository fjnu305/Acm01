server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/acm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:db/quartz-mysql.sql
    overwrite-existing-jobs: true
    auto-startup: true
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  elasticsearch:
    uris: ${SEARCH_ELASTICSEARCH_URIS:}
  autoconfigure:
    # 单机默认不连 ES / RabbitMQ；启用时从 exclude 去掉对应项并配 URI / NOTIFY_MQ_ENABLED
    exclude:
      - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

jwt:
  expiration: 86400000

acm:
  upload:
    avatar-dir: ./data/uploads/avatars
    avatar-public-path: /uploads/avatars
    avatar-max-bytes: 2097152
    official:
    username: acmer_official
  web:
    allowed-origins: ${ACM_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rate-limit:
    enabled: true
    window-seconds: 60
    anonymous-max-requests: 120
    authenticated-max-requests: 300

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# 赛事爬虫 HTTP 配置（OkHttp 连接池与重试，各平台 Crawler 共用）
contest:
  crawl:
    schedule:
      enabled: true
      cron: "0 */10 * * * ?"
      lock-ttl-minutes: 20
    http:
      max-idle-connections: 5       # 连接池最大空闲连接数
      keep-alive-minutes: 5           # 空闲连接保活时间
      connect-timeout-seconds: 10     # TCP 连接超时
      read-timeout-seconds: 30        # 读响应超时
      write-timeout-seconds: 10       # 写请求超时
      call-timeout-seconds: 60        # 单次请求总超时（含重试等待）
      max-retries: 3                  # 失败后重试次数（不含首次）
      retry-base-delay-millis: 500    # 重试退避基数（指数递增）
    atcoder:
      json-fallback-url: https://kenkoooo.com/atcoder/resources/contests.json
      html-url: https://atcoder.jp/contests/
      finished-keep-days: 90
    nowcoder:
      list-url: https://ac.nowcoder.com/acm/contest/vip-index?topCategoryFilter=13
      finished-keep-days: 90

# 模块 3：赛事订阅（仅订阅关系）
subscription:
  allowed-remind-minutes:
    - 1440
    - 60

# 模块 4：消息通知（扫描任务、发邮件）
notify:
  enabled: true
  scan-cron: "0 */1 * * * ?"
  scan-batch-size: 200
  scan-lock-ttl-seconds: 50
  stale-processing-seconds: 120
  max-retries: 3
  send-interval-millis: 1000
  retry:
    base-delay-seconds: 30
  mq:
    # 单机默认进程内投递；有 RabbitMQ 再设 NOTIFY_MQ_ENABLED=true
    enabled: ${NOTIFY_MQ_ENABLED:false}
    exchange: notify.exchange
    queue: notify.delivery.queue
    routing-key: notify.delivery
  rate-limit:
    user-min-interval-seconds: 60
  email:
    enabled: ${NOTIFY_EMAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@acmer.local}

# 模块 10：OJ 竞技数据同步
sync:
  credential-key-base64: ${SYNC_CREDENTIAL_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  schedule:
    enabled: true
    cron: "0 0 3 * * ?"
    lock-ttl-minutes: 60

# 模块 6：社交社区
social:
  feed:
    cache-ttl-minutes: 5
    hot-feed-size: 50

# Jasypt 解密密钥：仅本机环境变量 JASYPT_ENCRYPTOR_PASSWORD，不要写进 yaml
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# 模块 7：组队匹配权重
team:
  match:
    rating-weight: 0.4
    region-weight: 0.3
    tag-weight: 0.3
    recommend-limit: 20

# 模块 9：全文检索（默认关闭，启用时需本地 Elasticsearch）
search:
  enabled: false
  index-name: acm_search
  elasticsearch-uri: http://localhost:9200
  default-page-size: 20
